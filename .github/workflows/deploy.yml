# Builds the Next.js static export and publishes it to GitHub Pages.
#
# Pages serves static files only, so there is no server here by design: the
# backend is Supabase (Postgres + RLS + Edge Functions), deployed separately
# with the Supabase CLI. See docs/BACKEND.md.
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Playwright is a devDependency for the browser test suites, which this
        # workflow never runs. Skipping its postinstall keeps ~150 MB of browser
        # downloads out of a build that only needs `next build`.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Build static export
        env:
          # A project page lives at /<repo>/, so assets need that prefix.
          # A user/org page or custom domain should leave this empty.
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name != format('{0}.github.io', github.repository_owner) && format('/{0}', github.event.repository.name) || '' }}
          # Public by design: the anon key only grants what RLS allows.
          # Set these as repository *variables* (Settings > Secrets and
          # variables > Actions > Variables). Missing values are not fatal —
          # the app falls back to self-contained fragment links.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # NOTE: Pages must already be enabled on the repository, with
      # Settings > Pages > Source set to "GitHub Actions". That is a one-time
      # manual step and cannot be automated from here: creating a Pages site
      # needs repository-admin rights, and GITHUB_TOKEN does not have them
      # even with `pages: write` — `enablement: true` fails with
      # "Create Pages site failed. Error: Resource not accessible by
      # integration". Until it is enabled this step fails with
      # "Get Pages site failed ... Not Found".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
